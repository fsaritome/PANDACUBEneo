watcher:
  input_root: "./watch_test/input"
  output_root: "./watch_test/output"
  qc_root: "./watch_test/qc"
  failed_root: "./watch_test/failed"
  file_extensions: [".pdf"]
  max_workers: 2
  ledger_path: "./watch_test/state/ledger.sqlite3"
  work_dir: "./watch_test/state/work"
  disable_passthrough: true
  emit_docx: true

engine:
  primary: paddleocr
  strategy: single
  engine_options:
    paddleocr:
      use_gpu: true
      single_instance: true
      use_textline_orientation: true
      return_word_box: true
      text_det_box_thresh: 0.3

fallback:
  enabled: false

layout:
  backend: ppstructure
  ppstructure_words: engine
  ppstructure_options:
    use_gpu: true
    gpu_id: 0

preprocess:
  deskew: false
  max_page_megapixels: 40.0
  oversample_dpi: 300

languages: ["eng"]
log_level: "INFO"
