watcher:
  input_root: "./harder_test/input"
  output_root: "./harder_test/output"
  qc_root: "./harder_test/qc"
  failed_root: "./harder_test/failed"
  file_extensions: [".pdf"]
  max_workers: 4
  ledger_path: "./harder_test/state/ledger.sqlite3"
  work_dir: "./harder_test/state/work"
  disable_passthrough: true

engine:
  primary: paddleocr
  secondary: null
  strategy: single
  low_confidence_word_threshold: 60.0
  low_confidence_region_fraction: 0.15
  engine_options:
    paddleocr:
      use_gpu: true
      single_instance: true
      use_textline_orientation: true
      return_word_box: true
      split_lines_into_words: true

fallback:
  enabled: false

layout:
  backend: ppstructure
  ppstructure_words: engine
  ppstructure_options:
    use_gpu: true
    gpu_id: 0
  min_gap_fraction: 0.015
  margin_max_width_fraction: 0.12
  gap_density_threshold: 0.02

preprocess:
  deskew: false
  contrast_normalize: false
  max_page_megapixels: 40.0
  oversample_dpi: 300

languages: ["eng"]
log_level: "INFO"
