watcher:
  input_root: "./input"
  output_root: "./output"
  qc_root: "./qc"
  failed_root: "./failed"
  file_extensions: [".pdf"]
  max_workers: 8           # file-level concurrency: layout analysis + PDF I/O; VLM throughput is controlled by vl_rec_max_concurrency below
  ledger_path: "./state/ledger.sqlite3"
  work_dir: "./state/work"
  disable_passthrough: true

engine:
  primary: paddleocr_vl
  secondary: null
  strategy: single
  low_confidence_word_threshold: 60.0
  low_confidence_region_fraction: 0.15
  engine_options:
    paddleocr_vl:
      use_gpu: true
      vl_rec_backend: "vllm-server"
      vl_rec_server_url: "http://localhost:8118/v1"
      vl_rec_max_concurrency: 8   # concurrent HTTP requests in-flight to the vLLM server

fallback:
  enabled: false
  base_url: "http://ai01:11434/v1"
  api_key: "not-needed"
  model: "qwen2-vl"
  apply_as_text_layer: false
  timeout_seconds: 120

layout:
  min_gap_fraction: 0.015
  margin_max_width_fraction: 0.12
  gap_density_threshold: 0.02

preprocess:
  deskew: false
  contrast_normalize: false
  max_page_megapixels: 40.0

languages: ["eng"]
log_level: "INFO"