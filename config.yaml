# Copy to config.yaml and adjust paths. All values shown are the defaults.

watcher:
  input_root: "./input"
  output_root: "./output"
  qc_root: "./qc"        # per-file QC sidecars, mirrored tree, kept separate from output
  failed_root: "./failed" # files that raised during processing are moved here (mirrored tree)
  file_extensions: [".pdf"]
  max_workers: 4          # 4 workers, 2 per GPU; single_instance ~3GB/worker at peak leaves headroom on each 24GB card
  ledger_path: "./state/ledger.sqlite3"
  work_dir: "./state/work"
  disable_passthrough: true  # RENK corpus: force full re-OCR even on files with an existing text layer

engine:
  primary: paddleocr_vl     # paddleocr | paddleocr_vl | surya | abbyy
  secondary: null          # paddleocr-vl-only; no cross-check engine
  strategy: single         # single primary engine, no secondary reconciliation
  low_confidence_word_threshold: 60.0
  low_confidence_region_fraction: 0.15
  engine_options:
    paddleocr_vl: { use_gpu: true }

fallback:
  enabled: false
  base_url: "http://ai01:11434/v1"   # local vLLM/Ollama OpenAI-compatible endpoint
  api_key: "not-needed"
  model: "qwen2-vl"
  apply_as_text_layer: false          # (b) default: flag for human review, don't auto-graft LLM text
  timeout_seconds: 120

layout:
  min_gap_fraction: 0.015
  margin_max_width_fraction: 0.12
  gap_density_threshold: 0.02

preprocess:
  deskew: false               # R6: non-destructive only, defaults off
  contrast_normalize: false   # R6: non-destructive only, defaults off
  max_page_megapixels: 40.0   # downscale giant pages before OCR to avoid pathological runtimes

languages: ["eng"]
log_level: "INFO"
