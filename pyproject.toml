[project]
name = "patent-ocr"
version = "0.1.0"
description = "Self-hosted hot-folder OCR pipeline for patent PDFs (searchable-PDF sandwich, no cloud APIs)"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "ocrmypdf>=16.0",
    "pikepdf>=9.0",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "langdetect>=1.0.9",
    "PyYAML>=6.0",
    "requests>=2.31",
    "reportlab>=4.0",
]

[project.optional-dependencies]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
surya = ["surya-ocr>=0.6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
patent-ocr = "patent_ocr.cli:main"

[project.entry-points."ocrmypdf"]
patent_ocr_engine = "patent_ocr.ocrmypdf_plugin"

[tool.setuptools.packages.find]
include = ["patent_ocr*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
