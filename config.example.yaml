# Copy to config.yaml and adjust paths. All values shown are the defaults.

watcher:
  input_root: "./input"
  output_root: "./output"
  qc_root: "./qc"        # per-file QC sidecars, mirrored tree, kept separate from output
  failed_root: "./failed" # files that raised during processing are moved here (mirrored tree)
  file_extensions: [".pdf"]
  max_workers: 8          # with vllm-server backend: workers handle layout+I/O; VLM concurrency is vl_rec_max_concurrency
  ledger_path: "./state/ledger.sqlite3"
  work_dir: "./state/work"

engine:
  primary: paddleocr        # paddleocr | paddleocr_vl | surya | abbyy
  secondary: null           # optional second engine for cross-checking
  strategy: single          # single | always_parallel | low_confidence_only
  low_confidence_word_threshold: 60.0
  low_confidence_region_fraction: 0.15
  engine_options: {}        # per-engine kwargs, e.g.:
                            # paddleocr: { use_gpu: true, single_instance: true,
                            #              use_textline_orientation: true,
                            #              split_lines_into_words: true }
                            # paddleocr_vl: { use_gpu: true, vl_rec_backend: vllm-server,
                            #                vl_rec_server_url: http://localhost:8118/v1,
                            #                vl_rec_max_concurrency: 8 }
                            # NOTE: paddleocr_vl is a VLM with no text detector — it returns
                            # block-level boxes only, so word geometry is estimated and
                            # confidence is a fixed constant (QC/fallback cannot fire).
                            # Prefer paddleocr/surya when box alignment matters.

fallback:
  enabled: false
  base_url: "http://ai01:11434/v1"   # local vLLM/Ollama OpenAI-compatible endpoint
  api_key: "not-needed"
  model: "qwen2-vl"
  apply_as_text_layer: false          # (b) default: flag for human review, don't auto-graft LLM text
  timeout_seconds: 120

layout:
  backend: heuristic          # heuristic (OpenCV projection profiles) | ppstructure (trained
                              # PP-DocLayout model: reading order, semantic labels, tables)
  ppstructure_words: engine   # builtin = PPStructureV3's own line-level boxes
                              # engine  = primary engine's word-level boxes (extra pass).
                              # PPStructureV3 rejects return_word_box, so "builtin" can
                              # never give word-level geometry.
  ppstructure_options: {}     # PPStructureV3 kwargs, e.g. { use_gpu: true, gpu_id: 0 }
  min_gap_fraction: 0.015
  margin_max_width_fraction: 0.12
  gap_density_threshold: 0.02

preprocess:
  deskew: false               # R6: non-destructive only, defaults off
  contrast_normalize: false   # R6: non-destructive only, defaults off
  max_page_megapixels: 40.0   # downscale giant pages before OCR to avoid pathological runtimes
  oversample_dpi: 0           # minimum OCR raster DPI (0 = page native). PaddleOCR caps
                              # input at 4000px/side, so >300 on A4 is wasted transcoding.

languages: ["eng", "deu", "fra"]
log_level: "INFO"
